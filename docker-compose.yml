services:
  kanitel:
    build:
      context: .
    env_file:
      - path: .env
        required: false
    environment:
      ASPNETCORE_URLS: http://+:8080
      KANITEL_DATA_PATH: /data/kanitel.json
      KANITEL_WORKSPACES_PATH: /data/workspaces
      KANITEL_PUBLIC_API_URL: http://host.docker.internal:8080
    ports:
      - "8080:8080"
    volumes:
      - kanitel-data:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  kanitel-data:
