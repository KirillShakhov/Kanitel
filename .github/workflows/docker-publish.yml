name: Build and publish Docker image

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    name: Build and push
    runs-on: ubuntu-latest
    if: github.event.deleted == false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare image tags
        id: tags
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"
          branch_tag="${GITHUB_REF_NAME,,}"
          branch_tag="${branch_tag//\//-}"
          branch_tag="$(printf '%s' "$branch_tag" | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          branch_tag="${branch_tag:0:128}"
          branch_tag="$(printf '%s' "$branch_tag" | sed -E 's/[.-]+$//')"

          if [ -z "$branch_tag" ]; then
            branch_tag="branch"
          fi

          {
            echo "image=$image"
            echo "sha_tag=sha-$short_sha"
            echo "branch_tag=$branch_tag"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.branch_tag }}
